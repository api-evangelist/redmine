openapi: 3.2.0
info:
  title: Redmine REST Issues API
  description: REST API for Redmine project management. Base URL is your Redmine instance URL.
  version: 1.0.0
servers:
- url: https://{redmine_host}
  description: Redmine instance
  variables:
    redmine_host:
      default: redmine.example.com
security:
- apiKeyHeader: []
- apiKeyQuery: []
- basicAuth: []
tags:
- name: Issues
paths:
  /issues/{id}.json:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      summary: Show issue
      responses:
        '200':
          description: Issue
      tags:
      - Issues
      operationId: getIssues{id}Json
      x-operation-id-source: derived
    put:
      summary: Update issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Updated
      tags:
      - Issues
      operationId: putIssues{id}Json
      x-operation-id-source: derived
    delete:
      summary: Delete issue
      responses:
        '204':
          description: Deleted
      tags:
      - Issues
      operationId: deleteIssues{id}Json
      x-operation-id-source: derived
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
    basicAuth:
      type: http
      scheme: basic
