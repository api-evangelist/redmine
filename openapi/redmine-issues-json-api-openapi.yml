openapi: 3.1.0
info:
  title: Redmine REST Attachments Issues.json API
  description: REST API for Redmine project management. Base URL is your Redmine instance URL.
  version: 1.0.0
servers:
- url: https://{redmine_host}
  description: Redmine instance
  variables:
    redmine_host:
      default: redmine.example.com
security:
- apiKeyHeader: []
- apiKeyQuery: []
- basicAuth: []
tags:
- name: Issues.json
paths:
  /issues.json:
    get:
      summary: List issues
      parameters:
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Issue collection
      tags:
      - Issues.json
    post:
      summary: Create issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Issue created
      tags:
      - Issues.json
components:
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 25
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
    basicAuth:
      type: http
      scheme: basic
