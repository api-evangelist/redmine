openapi: 3.2.0
info:
  title: Redmine REST Groups.json API
  description: REST API for Redmine project management. Base URL is your Redmine instance URL.
  version: 1.0.0
servers:
- url: https://{redmine_host}
  description: Redmine instance
  variables:
    redmine_host:
      default: redmine.example.com
security:
- apiKeyHeader: []
- apiKeyQuery: []
- basicAuth: []
tags:
- name: Groups.json
paths:
  /groups.json:
    get:
      summary: List groups
      responses:
        '200':
          description: Groups
      tags:
      - Groups.json
      operationId: getGroupsJson
      x-operation-id-source: derived
    post:
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
      tags:
      - Groups.json
      operationId: postGroupsJson
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
    basicAuth:
      type: http
      scheme: basic
