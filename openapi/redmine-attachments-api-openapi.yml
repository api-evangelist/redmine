openapi: 3.1.0
info:
  title: Redmine REST Attachments API
  description: REST API for Redmine project management. Base URL is your Redmine instance URL.
  version: 1.0.0
servers:
- url: https://{redmine_host}
  description: Redmine instance
  variables:
    redmine_host:
      default: redmine.example.com
security:
- apiKeyHeader: []
- apiKeyQuery: []
- basicAuth: []
tags:
- name: Attachments
paths:
  /attachments/{id}.json:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      summary: Show attachment
      responses:
        '200':
          description: Attachment
      tags:
      - Attachments
    delete:
      summary: Delete attachment
      responses:
        '204':
          description: Deleted
      tags:
      - Attachments
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: key
    basicAuth:
      type: http
      scheme: basic
